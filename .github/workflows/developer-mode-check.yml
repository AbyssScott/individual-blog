name: Check blog developer mode (no deployment)
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/blog-developer-mode, feature/developer-studio-ui]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: node --check src/scripts/developer.js
      - run: npm run check
      - run: npm run build
      - name: Verify editor route exists
        run: test -f dist/developer/index.html

name: Validate and package private Astro preview (no publishing)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate content
        run: npm run validate
      - name: Type-check Astro
        run: npm run check
      - name: Verify safe build excludes unpublished drafts
        run: npm run build
      - name: Build private preview including demonstration drafts
        env:
          VITE_BLOG_PREVIEW_DRAFTS: 'true'
        run: npm run build
      - name: Package local-only private preview
        run: python3 scripts/package-private-preview.py
      - name: Upload private preview artifact (not a website deployment)
        uses: actions/upload-artifact@v4
        with:
          name: xiangs-blog-private-preview
          path: private-preview/
          if-no-files-found: error
          retention-days: 7
